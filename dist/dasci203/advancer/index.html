<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inside the HR CoPilot: how the AI actually answers</title>
<style>
  :root{
    --bg:#FAF9F5; --panel:#FFFFFF; --line:#E4E1D7;
    --ink:#201F1C; --ink2:#7A776D;
    --blue:#5B7C99; --aqua:#5E8D87; --orange:#C65D3B; --yellow:#A98A3E; --red:#B0402A;
    --serif:"Copernicus", Georgia, "Iowan Old Style", "Times New Roman", serif;
    --sans:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body,#root{height:100%;}
  body{font-family:var(--sans); background:var(--bg); color:var(--ink); overflow:hidden;
       -webkit-font-smoothing:antialiased;}
  .slide{position:absolute; inset:0; padding:52px 68px 78px; display:flex; flex-direction:column;}
  .kicker{font-size:12.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--ink2); margin-bottom:12px;}
  h1{font-family:var(--serif); font-weight:500; font-size:52px; line-height:1.14; letter-spacing:-.01em;}
  h2{font-family:var(--serif); font-weight:500; font-size:36px; line-height:1.18; letter-spacing:-.01em;}
  .sub{font-size:16.5px; color:var(--ink2); margin-top:12px; max-width:860px; line-height:1.55;}
  .stage{flex:1; display:flex; align-items:center; justify-content:center; position:relative;}
  .panel{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px 20px;
         box-shadow:0 1px 3px rgba(32,31,28,.05);}
  .big{font-size:22px; font-weight:bold;}
  .foot{position:fixed; left:68px; right:68px; bottom:20px; height:34px; display:flex;
        align-items:center; font-size:12px; color:var(--ink2); z-index:5;}
  .foot-title{white-space:nowrap;}
  .dots{position:absolute; left:50%; transform:translateX(-50%); display:flex; gap:8px; align-items:center;}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--line); cursor:pointer; transition:background .25s, transform .25s;}
  .dot.on{background:var(--orange); transform:scale(1.25);}
  .pager{position:fixed; right:68px; bottom:16px; z-index:6; display:flex; align-items:center;
         background:var(--panel); border:1px solid var(--line); border-radius:999px;
         box-shadow:0 1px 3px rgba(32,31,28,.06); overflow:hidden;}
  .pager button{display:flex; align-items:center; justify-content:center; width:40px; height:34px;
                background:none; border:none; color:var(--ink2); cursor:pointer; transition:color .2s;}
  .pager button:hover{color:var(--orange);}
  .pager .cnt{font-size:12px; letter-spacing:.08em; color:var(--ink); padding:0 4px; min-width:44px;
              text-align:center; font-variant-numeric:tabular-nums;
              border-left:1px solid var(--line); border-right:1px solid var(--line);
              height:34px; display:flex; align-items:center; justify-content:center; gap:4px;}
  .pager .cnt-sep{color:var(--ink2); font-size:11px;}
  .takeaway{margin-top:10px; text-align:center; font-family:var(--serif); font-size:18px;
            color:var(--ink2); max-width:920px; align-self:center; line-height:1.55;}
  .takeaway b{color:var(--ink); font-weight:600;}
  .pyr-scene{width:420px; height:360px; perspective:1100px;
             display:flex; align-items:flex-end; justify-content:center;}
  .pyr-tilt{transform:rotateX(-22deg); transform-style:preserve-3d; margin-bottom:46px;}
  .pyr-spin{position:relative; width:0; height:0; transform-style:preserve-3d;
            animation:pyrspin 32s linear infinite;}
  @keyframes pyrspin{from{transform:rotateY(0deg);} to{transform:rotateY(360deg);}}
  .pyr-step{position:relative; width:0; height:0; transform-style:preserve-3d;
            transition:transform .9s cubic-bezier(.4,0,.2,1);}
  .player{position:absolute; bottom:0; left:0; transform-style:preserve-3d;}
  .pface{position:absolute; bottom:0; transform-origin:bottom center; backface-visibility:hidden;}
  .pf1{filter:brightness(.93);} .pf2{filter:brightness(.97);} .pf3{filter:brightness(.88);}
  .pcap{filter:brightness(1.14); backface-visibility:hidden;}
  .cite{display:inline-block; background:rgba(198,93,59,.07); border:1px solid rgba(198,93,59,.45);
        color:var(--orange); font-size:12px; border-radius:6px; padding:3px 9px; margin:4px 4px 0 0;}
</style>
